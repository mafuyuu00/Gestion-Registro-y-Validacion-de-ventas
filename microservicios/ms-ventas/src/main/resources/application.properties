spring.application.name=ms-ventas
server.port=8080

# Base de datos H2 persistida en archivo (carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/ventasdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/ventasdb)
spring.h2.console.enabled=true
